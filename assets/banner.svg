<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Alyson Trizotto — Back-end Engineer">
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1b1f2a" stroke-width="1"/></pattern>
    <radialGradient id="fade" cx=".25" cy=".4" r=".8"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="m"><rect width="1000" height="260" fill="url(#fade)"/></mask>
    <radialGradient id="glow" cx=".2" cy=".4" r=".6"><stop offset="0" stop-color="#5eead4" stop-opacity=".16"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .dot{animation:p 2s ease-in-out infinite}
    .cur{animation:b 1s steps(1) infinite}
    .scan{animation:s 6s linear infinite}
    @keyframes p{50%{opacity:.25}}
    @keyframes b{50%{opacity:0}}
    @keyframes s{from{transform:translateX(-200px)}to{transform:translateX(1000px)}}
    @media (prefers-reduced-motion:reduce){.dot,.cur,.scan{animation:none}}
  </style>
  <rect x=".5" y=".5" width="999" height="259" rx="14" fill="#07080b" stroke="#1b1f2a"/>
  <rect width="1000" height="260" fill="url(#glow)"/>
  <rect width="1000" height="260" fill="url(#grid)" mask="url(#m)"/>
  <rect class="scan" y="258" width="200" height="2" fill="url(#g)" opacity=".8"/>
  <circle class="dot" cx="64" cy="64" r="4" fill="#5eead4"/>
  <text class="mono" x="80" y="68" font-size="13" fill="#5eead4">disponível para projetos</text>
  <text class="sans" x="60" y="146" font-size="62" font-weight="800" letter-spacing="-2" fill="#e8eaf0">Alyson <tspan fill="url(#g)">Trizotto</tspan></text>
  <text class="mono" x="62" y="190" font-size="18" fill="#7d8394"><tspan fill="#e8eaf0">&gt;</tspan> Back-end Engineer · Performance &amp; IA<tspan class="cur" fill="#5eead4"> ▌</tspan></text>
  <text class="mono" x="62" y="222" font-size="12" fill="#7d8394">Laravel · Rails · FastAPI · YOLOv11 · alta escala</text>
</svg>
