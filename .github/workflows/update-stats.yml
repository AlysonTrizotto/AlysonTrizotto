name: Atualizar GitHub Stats

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar estatísticas privadas
        run: |
          curl "https://github-readme-stats-seven-pearl-33.vercel.app/api?username=AlysonTrizotto&show_icons=true&bg_color=07080b&title_color=5eead4&text_color=e8eaf0&icon_color=818cf8&border_color=1b1f2a&count_private=true" -o stats.svg

      - name: Gerar card de linguagens (bytes)
        env:
          GH_USER: AlysonTrizotto
          # PAT fine-grained (Contents: read) para incluir repos privados; sem ele, só públicos
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python3 scripts/gen_langs.py

      - name: Commit e push das imagens
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add stats.svg langs.svg langs.json metrics.svg
          git commit -m 'Atualiza estatísticas privadas do GitHub' || echo "Nada para commitar"
          git pull --rebase
          git push
